<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" /> <!-- Indigo-500 -->
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" /> <!-- Pink-500 -->
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Main Hexagon Container -->
    <path d="M256 46 L446.5 156 V376 L256 486 L65.5 376 V156 Z" 
          fill="#1e1e2e" 
          stroke="url(#grad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Decorative Inner Hexagon (Thin) -->
    <path d="M256 86 L411 176 V336 L256 426 L101 336 V176 Z" 
          fill="none" 
          stroke="url(#grad)" 
          stroke-width="4" 
          stroke-opacity="0.3"/>
          
    <!-- Prompt Symbol: >_ -->
    <!-- The angle bracket > -->
    <path d="M186 206 L266 256 L186 306" 
          fill="none" 
          stroke="url(#grad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- The cursor _ -->
    <line x1="296" y1="306" x2="366" y2="306" 
          stroke="url(#grad)" 
          stroke-width="32" 
          stroke-linecap="round"/>
  </g>
</svg>