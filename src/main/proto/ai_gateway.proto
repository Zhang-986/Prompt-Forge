syntax = "proto3";

package ai_gateway;

option java_multiple_files = true;
option java_package = "com.zzk.infrastructure.ai.grpc.proto";
option java_outer_classname = "AiGatewayProto";

// AiGateway gRPC 服务定义
// 供 Java 服务内部调用 Go AI Gateway 的 AI 能力
service AiGateway {
  // 流式生成：Java 调用 Go 获取 AI 流式结果
  rpc GenerateStream(StreamRequest) returns (stream StreamChunk);

  // 获取用户可用模型列表
  rpc FetchAvailableModels(ModelsRequest) returns (ModelsResponse);

  // 模型连通性验证
  rpc ValidateModel(ValidateRequest) returns (ValidateResponse);

  // Chat Completion 转发：Java 发送完整请求体，Go 转发给 AI 厂商
  // 用于 Function Calling 场景，工具执行在 Java 端，LLM 调用走 Go
  rpc ForwardChatCompletion(ForwardChatRequest) returns (ForwardChatResponse);
}

// ChunkType 响应块类型
enum ChunkType {
  CONTENT = 0;    // 正式回答内容
  REASONING = 1;  // 深度思考/推理过程
  TOOL_CALL = 2;  // 工具调用
  DONE = 3;       // 流结束标识
}

// StreamRequest 流式生成请求
message StreamRequest {
  int64 user_id = 1;
  string provider = 2;
  string prompt = 3;
  int64 config_id = 4;  // 可选，指定配置 ID
}

// StreamChunk 流式响应的单个文本片段
message StreamChunk {
  ChunkType chunk_type = 1;
  string content = 2;
}

// ModelsRequest 获取可用模型请求
message ModelsRequest {
  int64 config_id = 1;
}

// ModelsResponse 可用模型响应
message ModelsResponse {
  repeated string models = 1;
}

// ValidateRequest 模型验证请求
message ValidateRequest {
  int64 config_id = 1;
}

// ValidateResponse 模型验证响应
message ValidateResponse {
  bool success = 1;
  string message = 2;
}

// ForwardChatRequest Chat Completion 转发请求
message ForwardChatRequest {
  int64 config_id = 1;              // 用户模型配置 ID（Go 端查配置获取 apiKey/baseUrl/provider）
  string request_body_json = 2;     // 完整的 OpenAI 格式请求体 JSON（含 messages + tools）
}

// ForwardChatResponse Chat Completion 转发响应
message ForwardChatResponse {
  string response_body_json = 1;    // AI 厂商的原始 JSON 响应
}
